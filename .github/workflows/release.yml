name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Extract version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # The binary embeds server.json, and the plugin build reads
      # npm/package.json, so both versions are fixed before the tag is
      # even looked at. Fail loudly instead of shipping a release whose
      # parts disagree about their version.
      - name: Check committed versions match the tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          for f in server.json npm/package.json; do
            got=$(jq -r .version "$f")
            if [ "$got" != "$VERSION" ]; then
              echo "::error::$f says $got, tag says $VERSION — bump it and re-tag"
              exit 1
            fi
          done

      - name: Build binaries
        run: |
          for GOOS in darwin linux windows; do
            for GOARCH in amd64 arm64; do
              BIN="figma-mcp-go"
              if [ "$GOOS" = "windows" ]; then BIN="figma-mcp-go.exe"; fi

              OUTDIR="npm/bin/${GOOS}-${GOARCH}"
              mkdir -p "$OUTDIR"

              GOOS=$GOOS GOARCH=$GOARCH go build \
                -o "$OUTDIR/$BIN" \
                ./cmd/figma-mcp-go

              if [ "$GOOS" != "windows" ]; then chmod +x "$OUTDIR/$BIN"; fi
            done
          done

      # npm Trusted Publishing: npm authenticates with the job's OIDC token
      # (id-token: write above), so there is no NPM_TOKEN to expire. It needs
      # npm 11.5.1 or later, which ships with Node 24.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Published right after the binaries are built. npm takes minutes to
      # make a new version readable, and the plugin build and GitHub release
      # below run during that time instead of after it.
      - name: Publish to npm
        working-directory: npm
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          cp ../README.md .
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          # Skip if this version is already published, so re-running a release
          # whose later steps failed does not stop on "cannot publish over".
          NAME=$(jq -r .name package.json)
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on npm, skipping publish"
          else
            npm publish --access public --provenance
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build plugin
        working-directory: plugin
        run: bun install --frozen-lockfile && bun run build

      - name: Package plugin
        run: zip -r plugin.zip plugin/manifest.json plugin/dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: plugin.zip
          generate_release_notes: true

      - name: Set version in server.json
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # `npm publish` returns when npm accepts the upload, but the version can
      # stay unreadable for minutes after that. The MCP Registry validates the
      # package by reading that version, so wait for the same URL to answer
      # before publishing. Checked every 5s, for up to 15 minutes.
      - name: Wait for the version on npm
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          NAME=$(jq -r .name npm/package.json)
          URL="https://registry.npmjs.org/$NAME/$VERSION"
          for i in $(seq 180); do
            if curl -sf -o /dev/null -H 'Cache-Control: no-cache' "$URL"; then
              echo "$NAME@$VERSION is readable on npm"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$NAME@$VERSION is still not readable on npm after 15 minutes"
          exit 1

      # npm sits behind a CDN, so the registry may still read a stale answer
      # for a moment after the check above passes. A few short retries cover
      # that. Log in on every attempt: the registry token is short-lived.
      - name: Publish to MCP Registry
        run: |
          for delay in 10 20 40; do
            if ./mcp-publisher login github-oidc && ./mcp-publisher publish; then
              exit 0
            fi
            echo "Publish failed, retrying in ${delay}s..."
            sleep "$delay"
          done
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
