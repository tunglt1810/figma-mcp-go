name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Extract version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # The binary embeds server.json and the plugin build reads
      # npm/package.json, so both are baked in before the tag is ever
      # consulted. Fail loudly rather than ship a release whose parts
      # disagree about which version they are.
      - name: Check committed versions match the tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          for f in server.json npm/package.json; do
            got=$(jq -r .version "$f")
            if [ "$got" != "$VERSION" ]; then
              echo "::error::$f says $got, tag says $VERSION — bump it and re-tag"
              exit 1
            fi
          done

      - name: Build binaries
        run: |
          for GOOS in darwin linux windows; do
            for GOARCH in amd64 arm64; do
              BIN="figma-mcp-go"
              if [ "$GOOS" = "windows" ]; then BIN="figma-mcp-go.exe"; fi

              OUTDIR="npm/bin/${GOOS}-${GOARCH}"
              mkdir -p "$OUTDIR"

              GOOS=$GOOS GOARCH=$GOARCH go build \
                -o "$OUTDIR/$BIN" \
                ./cmd/figma-mcp-go

              if [ "$GOOS" != "windows" ]; then chmod +x "$OUTDIR/$BIN"; fi
            done
          done

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Build plugin
        working-directory: plugin
        run: bun install --frozen-lockfile && bun run build

      - name: Package plugin
        run: zip -r plugin.zip plugin/manifest.json plugin/dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: plugin.zip
          generate_release_notes: true

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          cp ../README.md .
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          # Skip if this version is already out, so re-running a release
          # whose later steps failed does not die on "cannot publish over".
          NAME=$(jq -r .name package.json)
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on npm, skipping publish"
          else
            npm publish --access public --provenance
          fi

      - name: Set version in server.json
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # The registry validates the package against npm, and a version
      # published seconds ago can still 404 there while it propagates.
      # Retry with backoff instead of failing the release on that race.
      # Log in on every attempt: the registry token is short-lived and the
      # backoff can outlast it.
      - name: Publish to MCP Registry
        run: |
          for delay in 15 30 60 120 240; do
            if ./mcp-publisher login github-oidc && ./mcp-publisher publish; then
              exit 0
            fi
            echo "Publish failed, retrying in ${delay}s..."
            sleep "$delay"
          done
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
